# Literature: read from top to bottom, stage by stage.
#
# To add a book, copy a block and put it where it should be read.
#   id:      short and unique, lowercase-with-dashes. Never change it once set:
#            it is what people's ticks are saved against.
#   form:    Novel, Short stories, Play, Poetry or Epic & myth
#   region:  any short label, e.g. South Asia
#   why:     one line on why it is worth reading (optional)
# Order is the position in this file; numbers are worked out automatically.

